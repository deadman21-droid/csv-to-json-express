<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CSV to JSON Express - Convertidor Instantáneo</title>
    <style>
        :root {
            --primary: #2563eb;
            --primary-dark: #1d4ed8;
            --bg: #f8fafc;
            --card-bg: #ffffff;
            --text: #1e293b;
            --border: #cbd5e1;
        }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background-color: var(--bg);
            color: var(--text);
            margin: 0;
            padding: 20px;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }
        .container {
            background: var(--card-bg);
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 4px 6px -1px rgb(0 0 0 / 0.1);
            width: 100%;
            max-width: 600px;
        }
        h1 { margin-top: 0; font-size: 24px; color: var(--primary); }
        .subtitle { color: #64748b; font-size: 14px; margin-bottom: 20px; }
        .upload-area {
            border: 2px dashed var(--border);
            padding: 30px;
            text-align: center;
            border-radius: 8px;
            cursor: pointer;
            margin-bottom: 20px;
            background: #f8fafc;
        }
        .upload-area:hover { border-color: var(--primary); }
        input[type="file"] { display: none; }
        textarea {
            width: 100%;
            height: 150px;
            padding: 12px;
            border: 1px solid var(--border);
            border-radius: 6px;
            font-family: monospace;
            font-size: 13px;
            box-sizing: border-box;
            resize: vertical;
            margin-bottom: 15px;
        }
        .btn-group { display: flex; gap: 10px; }
        button, .btn-stripe {
            background-color: var(--primary);
            color: white;
            border: none;
            padding: 10px 16px;
            border-radius: 6px;
            font-weight: bold;
            cursor: pointer;
            text-decoration: none;
            display: inline-block;
            text-align: center;
            flex: 1;
        }
        button:hover, .btn-stripe:hover { background-color: var(--primary-dark); }
        .btn-stripe { background-color: #635bff; margin-bottom: 15px; width: 100%; box-sizing: border-box; }
        .btn-stripe:hover { background-color: #51499d; }
    </style>
</head>
<body>
    <div class="container">
        <h1>CSV to JSON Express</h1>
        <p class="subtitle">Convierte archivos CSV o datos tabulares en formato JSON estructurado al instante y con total privacidad.</p>
        
        <a href="https://buy.stripe.com/28E9AL51N3fgdo18Kgc7u03" target="_blank" class="btn-stripe">🚀 Desbloquear Acceso Ilimitado - 4,99 €</a>

        <label class="upload-area" id="drop-zone">
            <span id="file-label">📁 Haz clic aquí o arrastra tu archivo CSV</span>
            <input type="file" id="csv-file" accept=".csv">
        </label>

        <textarea id="json-output" placeholder="El código JSON resultante aparecerá aquí..." readonly></textarea>

        <div class="btn-group">
            <button id="copy-btn" onclick="copyJSON()">Copiar JSON</button>
            <button id="download-btn" onclick="downloadJSON()">Descargar .json</button>
        </div>
    </div>

    <script>
        const fileInput = document.getElementById('csv-file');
        const fileLabel = document.getElementById('file-label');
        const jsonOutput = document.getElementById('json-output');
        let rawJsonData = '';

        fileInput.addEventListener('change', function(e) {
            const file = e.target.files[0];
            if (file) {
                fileLabel.textContent = file.name;
                const reader = new FileReader();
                reader.onload = function(event) {
                    try {
                        const csvText = event.target.result;
                        const jsonResult = csvToJson(csvText);
                        rawJsonData = JSON.stringify(jsonResult, null, 2);
                        jsonOutput.value = rawJsonData;
                    } catch (err) {
                        jsonOutput.value = 'Error al procesar el archivo CSV. Asegúrate de que tiene un formato válido.';
                    }
                };
                reader.readAsText(file);
            }
        });

        function csvToJson(csv) {
            const lines = csv.split(/\r\n|\n/);
            const result = [];
            if (lines.length === 0) return result;
            const headers = lines[0].split(',').map(h => h.trim().replace(/^"|"$/g, ''));
            
            for (let i = 1; i < lines.length; i++) {
                if (!lines[i].trim()) continue;
                const currentLine = lines[i].split(',');
                const obj = {};
                for (let j = 0; j < headers.length; j++) {
                    obj[headers[j]] = currentLine[j] ? currentLine[j].trim().replace(/^"|"$/g, '') : '';
                }
                result.push(obj);
            }
            return result;
        }

        function copyJSON() {
            if (!rawJsonData) return;
            navigator.clipboard.writeText(rawJsonData);
            alert('¡JSON copiado al portapapeles!');
        }

        function downloadJSON() {
            if (!rawJsonData) return;
            const blob = new Blob([rawJsonData], { type: 'application/json' });
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url;
            a.download = 'datos-convertidos.json';
            a.click();
        }
    </script>
</body>
</html>
