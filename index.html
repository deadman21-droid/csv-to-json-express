    <style>
        :root {
            --primary: #2563eb;
            --primary-dark: #1d4ed8;
            --bg-color: #f8fafc;
            --card-bg: #ffffff;

            min-height: 100vh;
        }
        .container {
            background-color: var(--card-bg);

            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1);

            box-sizing: border-box;
        }
        h1 {
            font-size: 24px;
            color: var(--primary);
            margin-top: 0;

        }

        .btn-stripe {

        .btn-stripe:hover {
            background-color: #51499d;
        }
        .upload-area {
            border: 2px dashed var(--border-color);
            padding: 30px;
            text-align: center;
            border-radius: 8px;
            cursor: pointer;
            display: block;
            margin-bottom: 20px;
            background-color: #fff;
        }
        .upload-area:hover {
            border-color: var(--primary);
        }
        #csv-file {
            display: none;
        }
        #json-output {
            width: 100%;
            height: 150px;
            padding: 12px;
            border: 1px solid var(--border-color);
            border-radius: 6px;
            font-family: monospace;
            font-size: 13px;
            resize: vertical;
            box-sizing: border-box;
            margin-bottom: 20px;
            background-color: #f1f5f9;
        }

            display: flex;
            gap: 10px;
        }
        button, .btn-stripe {
            transition: background-color 0.2s;
        }
        button {
            background-color: var(--primary);
            color: white;
            border: none;
            padding: 10px 16px;
            border-radius: 6px;
            font-weight: bold;
            cursor: pointer;

            text-align: center;

<body>
    <div class="container">
        <h1>CSV to JSON Express</h1>
        <p class="subtitle">Convierte archivos CSV o datos tabulares en formato JSON estructurado al instante y con total privacidad.</p>
        
        <a href="https://buy.stripe.com/28E9AL51N3fgdo18Kgc7u03" target="_blank" class="btn-stripe">🚀 Desbloquear Acceso Ilimitado - 4,99 €</a>

        <label class="upload-area" id="drop-zone">
            <span id="file-label">📁 Haz clic aquí o arrastra tu archivo CSV</span>
            <input type="file" id="csv-file" accept=".csv">
        </label>

        <textarea id="json-output" placeholder="El código JSON resultante aparecerá aquí..." readonly></textarea>

        <div class="btn-group">
            <button id="copy-btn" onclick="copyJSON()">Copiar JSON</button>
            <button id="download-btn" onclick="downloadJSON()">Descargar .json</button>
        </div>
    </div>

    <script>
        const fileInput = document.getElementById('csv-file');
        const fileLabel = document.getElementById('file-label');
        const jsonOutput = document.getElementById('json-output');

        fileInput.addEventListener('change', function(e) {
            const file = e.target.files[0];
            if (file) {
                fileLabel.textContent = '📄 ' + file.name;
                const reader = new FileReader();
                reader.onload = function(event) {
                    try {
                        const text = event.target.result;
                        const jsonResult = csvToJson(text);
                        jsonOutput.value = JSON.stringify(jsonResult, null, 2);
                    } catch (err) {
                        jsonOutput.value = 'Error al procesar el archivo CSV.';
                    }
                };
                reader.readAsText(file);
            }
        });

        function csvToJson(csv) {
            const lines = csv.split(/\r\n|\n/);
            const result = [];
            if (lines.length === 0) return result;
            
            const firstLine = lines[0];
            const separator = firstLine.includes(';') ? ';' : ',';
            const headers = firstLine.split(separator).map(h => h.trim().replace(/^["'](.*)["']$/, '$1'));

            for (let i = 1; i < lines.length; i++) {
                if (!lines[i].trim()) continue;
                const currentLine = lines[i].split(separator);
                const obj = {};
                for (let j = 0; j < headers.length; j++) {
                    let value = currentLine[j] !== undefined ? currentLine[j].trim() : '';
                    value = value.replace(/^["'](.*)["']$/, '$1');
                    obj[headers[j]] = value;
                }
                result.push(obj);
            }
            return result;
        }

        function copyJSON() {
            if (!jsonOutput.value) return;
            navigator.clipboard.writeText(jsonOutput.value).then(() => {
                const btn = document.getElementById('copy-btn');
                const originalText = btn.textContent;
                btn.textContent = '¡Copiado!';
                setTimeout(() => btn.textContent = originalText, 2000);
            });
        }

        function downloadJSON() {
            if (!jsonOutput.value) return;
            const blob = new Blob([jsonOutput.value], { type: 'application/json' });
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url;
            a.download = 'data.json';
            document.body.appendChild(a);
            a.click();
            document.body.removeChild(a);
            URL.revokeObjectURL(url);
        }
    </script>
</body>
